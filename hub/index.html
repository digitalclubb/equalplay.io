<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Equal Play. Rugby coaching for U7 to U12</title>
    <meta
      name="description"
      content="Rugby drills and session plans for minis and junior coaches, U7 to U12, filtered to what your age grade is allowed to do."
    />
    <!-- Private, account-only area. Crawlable on purpose: a robots.txt Disallow
         would stop Google ever reading this noindex. The URL could still be
         indexed from inbound links. -->
    <meta name="robots" content="noindex,nofollow" />

    <meta name="theme-color" content="#000537" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Equal Play" />
    <!-- One manifest for one product. See docs/one-product.md. -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Before the stylesheet, so a coach who picked a scheme never sees the
         other one flash first. Inline and tiny on purpose: a module would land
         after paint and defeat the point. `src/lib/theme.ts` owns the rest. -->
    <script>
      try {
        var t = localStorage.getItem("equalplay_scheme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Linked from the document rather than imported by `hub/main.ts`. A JS
         import means the browser has nothing to block paint on, so it can put
         the page up unstyled and the logo at its intrinsic size first. The
         planner has always done it this way. `inline-css` in vite.config.ts
         turns both into a <style> in the head at build. -->
    <link rel="stylesheet" href="/src/hub/styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Outfit:wght@700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Outfit:wght@700&display=swap"
    /></noscript>
  </head>
  <body>
    <button type="button" class="skip-link" id="skip-link">Skip to main content</button>
    <!-- One markup shape, two layouts. A navy bar across the top on a phone, a
         full-height column down the side on a desktop. Grid placement does the
         work so nothing is duplicated or hidden. -->
    <div class="app-shell">
    <div class="header-bar app-chrome">
      <header class="app-header">
        <h1 class="logo">
          <a href="/" class="logo-link">
            <svg class="logo-whistle" aria-hidden="true" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
              <g fill="#e75333">
                <path d="M42.429,85.098l-7.46-13.395l39.167-39.192c15.618-12.947,28.398,1.138,25.433,16.215C95.421,69.811,81.16,72.085,81.16,72.085C68.16,73.767,65,62.25,65,62.25L42.429,85.098z M38.669,85.52l-6.762-12.217L0,62.188l6.838,12.735L38.669,85.52z M68.111,69.697c-3.24-2.792-3.525-4.912-3.525-4.912l-3.014,2.736L68.111,69.697z M83.541,24.843c-6.641,0.041-11.96,5.519-11.96,5.519L32.454,69.811L0,58.846l37.747-38.21c9.375-9.49,18.786-4.784,18.786-4.784l5.539,1.844c3.655-4.917,11.055-3.07,12.762-1.761c3.643,2.793,2.587,6.035,2.193,6.74L83.541,24.843z M66.814,19.274l5.828,1.94C73.645,18.162,68.6,16.971,66.814,19.274z M60.6,35.187l-22.963-7.765l-8.13,8.088l22.962,7.765L60.6,35.187z"/>
              </g>
            </svg>
            <span class="logo-text">Equal <span class="logo-text-play">Play</span></span>
          </a>
        </h1>
      </header>
      <!-- The same four tabs src/lib/nav.ts renders, written out so the chrome
           paints with the document instead of waiting on a 400 kB bundle. Without
           it the header was a logo on navy for as long as the bundle took, then
           jumped 124px when the nav appeared. `nav markup matches src/lib/nav.ts`
           in nav.test.ts fails if the two ever drift. The active tab is left to
           the router: it only paints a background, so it moves nothing. -->
      <nav class="hub-nav" id="hub-nav" aria-label="Sections">
        <a href="#/catalogue" class="hub-tab" data-route="catalogue"><svg class="hub-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 6 17.5h12z"/><path d="M3.5 20.5h17"/></svg><span class="hub-tab-label">Drills</span></a>
        <a href="#/plans" class="hub-tab" data-route="plans"><svg class="hub-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 9h8"/><path d="M8 13h8"/><path d="M8 17h5"/></svg><span class="hub-tab-label">Sessions</span></a>
        <a href="/planner" class="hub-tab" data-route="planner"><svg class="hub-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3.5 20 7.5l-4 4"/><path d="M20 7.5H4"/><path d="M8 20.5 4 16.5l4-4"/><path d="M4 16.5h16"/></svg><span class="hub-tab-label">Match day</span></a>
        <a href="#/guide" class="hub-tab" data-route="guide"><svg class="hub-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.2C10.4 5.6 8 5 4.5 5v12.5c3.5 0 5.9.6 7.5 2.2 1.6-1.6 4-2.2 7.5-2.2V5c-3.5 0-5.9.6-7.5 2.2z"/><path d="M12 7.2v12.5"/></svg><span class="hub-tab-label">Guide</span></a>
        <a href="#/account" class="hub-tab" data-route="account"><svg class="hub-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.5c.6-3.8 3.7-5.8 7.2-5.8s6.6 2 7.2 5.8"/></svg><span class="hub-tab-label">Account</span></a>
      </nav>
    </div>
    <main id="hub-view" class="app-view" tabindex="-1"></main>
    <footer class="site-links">
      <nav aria-label="Site">
        <a href="/">About Equal Play</a>
        <a href="/privacy">Privacy</a>
      </nav>
      <!-- Written out the way the nav is, so the footer paints with the
           document. `scheme markup matches src/lib/theme.ts` in nav.test.ts
           fails if this and the module ever drift. -->
      <div class="scheme-switch" role="group" aria-label="Colour scheme">
        <span class="scheme-label" aria-hidden="true">Colours</span>
        <button type="button" class="scheme-option is-active" data-scheme="system" aria-pressed="true">Auto</button><button type="button" class="scheme-option" data-scheme="light" aria-pressed="false">Light</button><button type="button" class="scheme-option" data-scheme="dark" aria-pressed="false">Dark</button>
      </div>
    </footer>
    </div>
    <script type="module" src="/src/hub/main.ts"></script>
  </body>
</html>
