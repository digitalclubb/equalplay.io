<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The app itself. Targets "rugby rotation planner"; the homepage owns the
         brand terms and /rugby-substitution-app owns "rugby substitution app",
         so none of the three compete. -->
    <title>Rugby Rotation Planner for Match Day | Equal Play</title>
    <meta
      name="description"
      content="Build a fair rotation for your squad in seconds, then keep game time even as players arrive late or come off injured. Free, works on your phone, no sign-up."
    />
    <link rel="canonical" href="https://equalplay.io/planner" />

    <!-- PWA -->
    <meta name="theme-color" content="#000537" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Equal Play" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:title" content="Equal Play. Fair game time for every child, every match" />
    <meta
      property="og:description"
      content="Build a fair rotation for your squad in seconds, then keep game time even as players arrive late or come off injured. Free, no sign-up."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://equalplay.io/planner" />
    <!-- og:image must precede its sub-properties. They bind to the image above them -->
    <meta property="og:image" content="https://equalplay.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Equal Play. Fair game time for every child, every match" />
    <meta property="og:site_name" content="Equal Play" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Equal Play. Fair game time for every child, every match" />
    <meta
      name="twitter:description"
      content="Build a fair rotation for your squad in seconds, then keep game time even as players arrive late or come off injured. Free, no sign-up."
    />
    <meta name="twitter:image" content="https://equalplay.io/og-image.png" />
    <meta name="twitter:image:alt" content="Equal Play. Fair game time for every child, every match" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Equal Play",
      "url": "https://equalplay.io/planner",
      "applicationCategory": "SportsApplication",
      "operatingSystem": "Any",
      "inLanguage": "en-GB",
      "isAccessibleForFree": true,
      "description": "Free rugby substitution app for minis and junior coaches. Plan rotations, track equal playing time, handle late arrivals and injuries on match day. Works for any youth team sport.",
      "featureList": [
        "Fair rotation planning across a full match day",
        "Equal playing time tracking per player",
        "Late arrival and early departure handling",
        "Injury substitutions with automatic cover",
        "Multiple teams stored on one device",
        "Works offline, no sign-up required"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "GBP"
      }
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Fonts loaded async. App renders immediately with system font, swaps when ready -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Outfit:wght@700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Outfit:wght@700&display=swap" /></noscript>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <!-- Static header. Paints before JS loads (LCP optimisation) -->
      <div class="header-bar app-chrome" id="header-bar">
        <header class="app-header">
          <h1 class="logo">
            <a href="/" class="logo-link">
            <svg class="logo-whistle" aria-hidden="true" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
              <g fill="#e75333">
                <path d="M42.429,85.098l-7.46-13.395l39.167-39.192c15.618-12.947,28.398,1.138,25.433,16.215C95.421,69.811,81.16,72.085,81.16,72.085C68.16,73.767,65,62.25,65,62.25L42.429,85.098z M38.669,85.52l-6.762-12.217L0,62.188l6.838,12.735L38.669,85.52z M68.111,69.697c-3.24-2.792-3.525-4.912-3.525-4.912l-3.014,2.736L68.111,69.697z M83.541,24.843c-6.641,0.041-11.96,5.519-11.96,5.519L32.454,69.811L0,58.846l37.747-38.21c9.375-9.49,18.786-4.784,18.786-4.784l5.539,1.844c3.655-4.917,11.055-3.07,12.762-1.761c3.643,2.793,2.587,6.035,2.193,6.74L83.541,24.843z M66.814,19.274l5.828,1.94C73.645,18.162,68.6,16.971,66.814,19.274z M60.6,35.187l-22.963-7.765l-8.13,8.088l22.962,7.765L60.6,35.187z"/>
              </g>
            </svg>
            <span class="logo-text">Equal <span class="logo-text-play">Play</span></span>
            </a>
          </h1>
        </header>
        <!-- The same four tabs the hub renders from src/lib/nav.ts. Static here on
             purpose: this header paints before the bundle arrives and that is the
             page's LCP. `nav markup matches src/lib/nav.ts` in nav.test.ts fails if
             the two ever drift. -->
        <nav class="hub-nav" aria-label="Sections">
          <a href="/hub#/catalogue" class="hub-tab" data-route="catalogue">Drills</a>
          <a href="/planner" class="hub-tab is-active" aria-current="page" data-route="planner">Planner</a>
          <a href="/hub#/plans" class="hub-tab" data-route="plans">Sessions</a>
          <a href="/hub#/account" class="hub-tab" data-route="account">Account</a>
        </nav>
      </div>
      <main id="app" class="app-view">
        <!-- Teams are the planner's own control, not navigation, so they sit at
             the top of its view rather than in the shared chrome. -->
        <nav id="tabs-container" aria-label="Teams"></nav>
        <div id="main-content"></div>
      </main>
      <footer class="site-links">
      <nav aria-label="Guides">
        <a href="/">Home</a>
        <a href="/hub">Coaching hub</a>
        <a href="/rugby-substitution-app">Rugby substitution app</a>
        <a href="/equal-playing-time-calculator">Equal playing time calculator</a>
        <a href="/rfu-regulation-15-playing-time">Regulation 15 playing time</a>
        <a href="/privacy">Privacy</a>
      </nav>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
